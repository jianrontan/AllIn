[pytest]
# Register custom markers so the pytest CLI doesn't emit
# "PytestUnknownMarkWarning" for our marks. New marks added here.
#
# `slow` marks tests that take more than ~30 s to run -- currently the
# Hypothesis property suite in test_poker_game_properties.py (~11 min
# walltime). CI runs `pytest -m "not slow"` to keep the per-deploy feedback
# loop short (~5 min total); a separate scheduled workflow
# (.github/workflows/nightly-tests.yml) runs the full suite including slow
# tests so the property invariants still get exercised regularly. Locally,
# `python -m pytest tests/` runs everything; `python -m pytest tests/ -m "not slow"`
# matches CI; `python -m pytest tests/ -m slow` runs only the slow ones.
markers =
    slow: marks tests >30s (Hypothesis property suite); skipped in PR CI, run nightly
