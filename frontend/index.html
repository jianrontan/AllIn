<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/spade.svg" />

    <title>AllIn — heads-up Texas Hold'em poker AI</title>

    <!-- Search-engine description. ~150 chars sits well in the SERP snippet
         (Google clips around 155-160 on desktop, ~120 on mobile). -->
    <meta name="description" content="AllIn is an open-source heads-up Texas Hold'em poker AI: a 128k info-set Monte Carlo CFR+ blueprint with a live river subgame solver. Play it in your browser." />

    <!-- Canonical URL helps Google deduplicate page variants. -->
    <link rel="canonical" href="https://allin.jianrontan.com/" />

    <!-- Open Graph (Facebook, LinkedIn, Discord, iMessage previews). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AllIn" />
    <meta property="og:title" content="AllIn — heads-up Texas Hold'em poker AI" />
    <meta property="og:description" content="Open-source heads-up Texas Hold'em poker AI. 128k info-set Monte Carlo CFR+ blueprint with a live river subgame solver. Play it in your browser." />
    <meta property="og:url" content="https://allin.jianrontan.com/" />
    <meta property="og:image" content="https://allin.jianrontan.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="AllIn — heads-up Texas Hold'em poker AI" />

    <!-- Twitter / X large-image card. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AllIn — heads-up Texas Hold'em poker AI" />
    <meta name="twitter:description" content="Open-source heads-up Texas Hold'em poker AI. 128k info-set Monte Carlo CFR+ blueprint with a live river subgame solver. Play it in your browser." />
    <meta name="twitter:image" content="https://allin.jianrontan.com/og-image.png" />

    <!-- Theme color for mobile Safari + PWA installs. -->
    <meta name="theme-color" content="#0a0a0a" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
