# Nightly full-test workflow. Runs the WHOLE pytest suite -- including the
# Hypothesis property tests in test_poker_game_properties.py that the
# per-deploy backend-deploy.yml skips via `-m "not slow"` to keep CI fast.
#
# The point isn't to gate deploys (deploys go through backend-deploy.yml on
# every push); it's to surface property-invariant regressions within ~24h
# of merging. If this workflow goes red, look at the run's failure step
# and either revert the offending commit or open a bug-log entry.
#
# Cron: 18:00 UTC daily -- 02:00 SGT (author's timezone). Adjustable.
# Manual trigger via workflow_dispatch for ad-hoc full runs.

name: Nightly tests

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  POSTFLOP_TABLES_RELEASE: assets-v2

jobs:
  full-test-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Same release-asset fetch as backend-deploy.yml -- the slow tests
      # need the blueprint + postflop tables on disk.
      - name: Fetch baked postflop tables + blueprint from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p backend/bot/analysis/abstractions/
          mkdir -p backend/bot/analysis/blueprints/
          gh release download "$POSTFLOP_TABLES_RELEASE" \
            -p "postflop_table_flop.npz" \
            -p "postflop_table_turn.npz" \
            -p "blueprint_final_v2.db" \
            -D /tmp/release-assets/
          mv /tmp/release-assets/postflop_table_*.npz \
            backend/bot/analysis/abstractions/
          mv /tmp/release-assets/blueprint_final_v2.db \
            backend/bot/analysis/blueprints/
          chmod a+r backend/bot/analysis/abstractions/postflop_table_*.npz \
                    backend/bot/analysis/blueprints/blueprint_final_v2.db

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Reuses the same `test` stage as backend-deploy.yml + the same GHA
      # layer cache. Most nights nothing has changed since the last deploy
      # -> all layers hit cache -> build is ~30s.
      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          load: true
          tags: allin:test-nightly
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Full suite including @pytest.mark.slow (the Hypothesis property
      # tests). Walltime expected ~25 min; the job timeout is set
      # generously above.
      - name: Run FULL backend test suite (incl. slow)
        run: |
          docker run --rm \
            -e ALLIN_SESSION_STORE=memory \
            -e ALLIN_STORE_BACKEND=memory \
            -w /app/backend/bot \
            --entrypoint python \
            allin:test-nightly \
            -m pytest tests/ -q --tb=short
