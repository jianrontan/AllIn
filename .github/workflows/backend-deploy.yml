# Backend CI/CD: on push to main (or manual trigger), test + build + deploy.
#
# Flow:
#   1. Pull the baked postflop tables from a GitHub Release asset (they're too
#      large to commit -- turn table is ~127MB, GitHub's per-file cap is 100MB)
#   2. Build the Dockerfile's `test` stage and run pytest inside it
#   3. If tests pass: build the `prod` stage, push to ECR, redeploy Lightsail
#   4. Poll Lightsail until ACTIVE, then verify /api/healthz reports the new SHA
#
# AWS auth uses OIDC -- no long-lived keys in GitHub Secrets. The one-time IAM
# role + OIDC provider setup is in author-only docs/private/CICD_SETUP.md
# (gitignored, not visible to repo viewers).
#
# Skipped path: anything outside backend/, Dockerfile, docker-entrypoint.sh, or
# this workflow file. Frontend (CF Pages) auto-deploys on its own via CF's Git
# integration -- not handled here.

name: Backend deploy

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - Dockerfile
      - .dockerignore
      - docker-entrypoint.sh
      - .github/workflows/backend-deploy.yml
  workflow_dispatch:

permissions:
  id-token: write    # required for OIDC role assumption
  contents: read

env:
  AWS_REGION: ap-southeast-1
  ECR_REGISTRY: 361611338374.dkr.ecr.ap-southeast-1.amazonaws.com
  ECR_REPO: allin
  LIGHTSAIL_SERVICE: allin
  # GitHub Release tag that holds the baked postflop tables as assets. Update
  # when re-baking (centroid changes). Tag must already exist.
  POSTFLOP_TABLES_RELEASE: assets-v2

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    # 60 min headroom: tests alone take ~19 min, image build ~5 min, ECR push
    # ~2 min, Lightsail rollout up to ~10 min. The slow tests are the bottleneck;
    # marking the property-based suite slow-and-skipping it in CI would let us
    # drop this back to 25 min. Until then, 60 is the safe margin.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Three large artifacts aren't in git -- the baked postflop tables (~127MB
      # turn, ~5MB flop) and the trained blueprint DB (~37MB). CI pulls all
      # three from the release named by POSTFLOP_TABLES_RELEASE above (the
      # assets release, NOT the project version tag). Upload replacements with:
      #   gh release upload assets-v2 \
      #     backend/bot/analysis/abstractions/postflop_table_flop.npz \
      #     backend/bot/analysis/abstractions/postflop_table_turn.npz \
      #     backend/bot/analysis/blueprints/blueprint_final_v2.db --clobber
      - name: Fetch baked postflop tables + blueprint from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p backend/bot/analysis/abstractions/
          mkdir -p backend/bot/analysis/blueprints/
          gh release download "$POSTFLOP_TABLES_RELEASE" \
            -p "postflop_table_flop.npz" \
            -p "postflop_table_turn.npz" \
            -p "blueprint_final_v2.db" \
            -D /tmp/release-assets/
          mv /tmp/release-assets/postflop_table_*.npz \
            backend/bot/analysis/abstractions/
          mv /tmp/release-assets/blueprint_final_v2.db \
            backend/bot/analysis/blueprints/
          # gh release download creates files with restrictive perms (0600).
          # The Dockerfile's `USER allin` runs gunicorn as UID 10001, which
          # can't open a root-only file COPY'd in. Make these world-readable
          # so the non-root container user can load them. (The local docker
          # build doesn't hit this because the file's local perms are 0644.)
          chmod a+r backend/bot/analysis/abstractions/postflop_table_*.npz \
                    backend/bot/analysis/blueprints/blueprint_final_v2.db
          ls -lh backend/bot/analysis/abstractions/postflop_table_*.npz \
                 backend/bot/analysis/blueprints/blueprint_final_v2.db

      - name: Derive short SHA
        id: meta
        run: echo "sha=$(echo ${GITHUB_SHA} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build the test stage (extends `base`, adds pytest/moto/hypothesis).
      # The `load: true` brings the image into the local Docker daemon so the
      # next step can `docker run` it. The `cache-*` lines reuse layers across
      # CI runs via GitHub's free per-repo cache.
      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          load: true
          tags: allin:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Verify the test image actually has the tests directory inside it before
      # pytest runs. If this `ls` errors, the .dockerignore is still excluding
      # tests/ (or the COPY layer is stale-cached from a prior build).
      - name: Verify tests/ present in image
        run: |
          docker run --rm --entrypoint sh allin:test -c \
            'ls -la /app/backend/bot/tests/ | head -20'

      # Diagnose blueprint loading AS the non-root user (mirrors prod). If
      # the prod image fails with "none were readable", the underlying error
      # is swallowed by _read_total_iterations() in config.py -- this step
      # reproduces it with the real exception type + message visible. Runs
      # as UID 10001 to match the `USER allin` in the prod stage.
      - name: Diagnose blueprint loading (as non-root)
        run: |
          docker run --rm --user 10001 \
            -w /app/backend/bot \
            --entrypoint python \
            allin:test \
            -c '
          import sqlite3, os, sys
          path = "analysis/blueprints/blueprint_final_v2.db"
          print("=== filesystem checks ===", file=sys.stderr)
          print(f"exists: {os.path.exists(path)}", file=sys.stderr)
          if not os.path.exists(path):
              print("BLUEPRINT FILE NOT IN IMAGE", file=sys.stderr)
              sys.exit(2)
          st = os.stat(path)
          print(f"size: {st.st_size} bytes", file=sys.stderr)
          print(f"mode: {oct(st.st_mode)}", file=sys.stderr)
          print(f"file uid: {st.st_uid}  process uid: {os.getuid()}", file=sys.stderr)
          print(f"R_OK: {os.access(path, os.R_OK)}", file=sys.stderr)
          print("=== sqlite3 open ===", file=sys.stderr)
          try:
              conn = sqlite3.connect(f"file:{path}?mode=ro", uri=True)
              row = conn.execute(
                  "SELECT value FROM training_metadata WHERE key = '"'"'total_iterations'"'"'"
              ).fetchone()
              print(f"opened ok; total_iterations row = {row}", file=sys.stderr)
              conn.close()
          except Exception as e:
              print(f"FAILED: {type(e).__name__}: {e}", file=sys.stderr)
              sys.exit(3)
          '

      # Run pytest INSIDE the image. This is the closest thing to staging we
      # have: the image-under-test extends the same base layers as the image
      # that will deploy if these pass. Override entrypoint because the prod
      # entrypoint is gunicorn.
      #
      # `-m "not slow"` skips the Hypothesis property suite
      # (test_poker_game_properties.py, ~11 min walltime) so per-deploy CI
      # stays ~5 min. The full suite (including slow) runs on the
      # nightly-tests.yml schedule so the property invariants still get
      # exercised regularly. See backend/bot/pytest.ini for the marker
      # registration.
      - name: Run backend tests
        run: |
          docker run --rm \
            -e ALLIN_SESSION_STORE=memory \
            -e ALLIN_STORE_BACKEND=memory \
            -w /app/backend/bot \
            --entrypoint python \
            allin:test \
            -m pytest tests/ -m "not slow" -q --tb=short

      # Below this line we mutate prod (ECR + Lightsail). Test failure above
      # exits the job before we ever get here.

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::361611338374:role/github-actions-allin-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" | \
            docker login --username AWS --password-stdin "$ECR_REGISTRY"

      # Build the PROD stage and push directly to ECR. Reuses the same cached
      # base layers from the test build above -- only the prod-specific final
      # layers (non-root user, entrypoint) are new work.
      - name: Build and push prod image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ steps.meta.outputs.sha }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Update the running Lightsail deployment IN PLACE: fetch the existing
      # containers + publicEndpoint blocks, swap ONLY the image tag and the
      # ALLIN_GIT_SHA env var, resubmit. This preserves the other env vars
      # (Cognito IDs, AWS runtime keys, CORS origins) -- they stay in Lightsail
      # console and never touch GitHub.
      #
      # SECURITY: The Lightsail API returns container env vars in its JSON
      # responses, which includes the long-lived AWS_ACCESS_KEY_ID and
      # AWS_SECRET_ACCESS_KEY this container uses for DynamoDB. Public repo
      # = public CI logs, so we must (a) extract those into ::add-mask::
      # before any later step can print them and (b) swallow the
      # create-container-service-deployment response (which would echo them).
      - name: Update Lightsail deployment
        id: deploy
        run: |
          set -e
          NEW_IMAGE="${ECR_REGISTRY}/${ECR_REPO}:${{ steps.meta.outputs.sha }}"
          NEW_SHA="${{ steps.meta.outputs.sha }}"

          # Record the CURRENT version before the new deployment. Lightsail
          # keeps the old `currentDeployment` serving traffic until the new one
          # becomes healthy, then increments `currentDeployment.version`. The
          # wait step below polls for version > old_version so we know the
          # NEW deployment is live (not just that the old one is still ACTIVE).
          OLD_VERSION=$(aws lightsail get-container-services \
            --service-name "$LIGHTSAIL_SERVICE" \
            --query "containerServices[0].currentDeployment.version" \
            --output text)
          echo "old_version=$OLD_VERSION" >> $GITHUB_OUTPUT
          echo "Pre-deploy currentDeployment.version=$OLD_VERSION"

          aws lightsail get-container-services \
            --service-name "$LIGHTSAIL_SERVICE" \
            --query "containerServices[0].currentDeployment" \
            --output json > current.json

          # Pull each env var value out and register it with the GHA log
          # masker BEFORE any subsequent step. Once masked, GitHub redacts
          # the value as `***` in all log output for the rest of the job.
          for key in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            val=$(jq -r --arg k "$key" \
              '.containers[].environment[$k] // empty' current.json)
            if [ -n "$val" ]; then
              echo "::add-mask::$val"
            fi
          done

          jq --arg img "$NEW_IMAGE" --arg sha "$NEW_SHA" \
            '.containers | map_values(
                .image = $img |
                .environment.ALLIN_GIT_SHA = $sha
             )' \
            current.json > containers.json

          jq '.publicEndpoint' current.json > endpoint.json

          # Swallow the response (it echoes the full container config incl.
          # env vars). We poll for ACTIVE in the next step so the response
          # body isn't needed here.
          aws lightsail create-container-service-deployment \
            --service-name "$LIGHTSAIL_SERVICE" \
            --containers file://containers.json \
            --public-endpoint file://endpoint.json \
            > /dev/null

          # Defensive cleanup -- the runner is ephemeral but no reason to
          # leave the files around for the next step's logs to accidentally
          # cat.
          rm -f current.json containers.json endpoint.json

      # Poll until the NEW deployment is promoted to currentDeployment. Lightsail
      # rolls deploys atomically: the previous deployment keeps serving traffic
      # in `currentDeployment` while the new one rolls out under `nextDeployment`,
      # then version increments + currentDeployment swaps once the new container
      # passes its health check. We watch for that version bump rather than
      # currentDeployment.state -- the old deployment's state is already ACTIVE
      # the whole time so state alone is the wrong signal (caught this the hard
      # way on the first CI run).
      - name: Wait for new deployment to roll
        run: |
          OLD_VERSION="${{ steps.deploy.outputs.old_version }}"
          echo "Waiting for currentDeployment.version > $OLD_VERSION ..."
          for i in $(seq 1 60); do
            sleep 10
            VERSION=$(aws lightsail get-container-services \
              --service-name "$LIGHTSAIL_SERVICE" \
              --query "containerServices[0].currentDeployment.version" \
              --output text)
            STATE=$(aws lightsail get-container-services \
              --service-name "$LIGHTSAIL_SERVICE" \
              --query "containerServices[0].currentDeployment.state" \
              --output text)
            echo "[$i/60] currentDeployment.version=$VERSION state=$STATE"
            if [ "$VERSION" -gt "$OLD_VERSION" ] && [ "$STATE" = "ACTIVE" ]; then
              echo "New deployment promoted to current"
              exit 0
            fi
            # If a NEW nextDeployment is FAILED, Lightsail rolls back -- which
            # means currentDeployment.version stays at OLD_VERSION forever. Detect
            # this explicitly and surface the failure.
            NEXT_STATE=$(aws lightsail get-container-services \
              --service-name "$LIGHTSAIL_SERVICE" \
              --query "containerServices[0].nextDeployment.state" \
              --output text 2>/dev/null || echo "None")
            if [ "$NEXT_STATE" = "FAILED" ]; then
              echo "::error::Lightsail rolled back -- nextDeployment FAILED"
              exit 1
            fi
          done
          echo "::error::New deployment did not promote within 10 minutes"
          exit 1

      # Final cross-check: the live /api/healthz reports the new SHA. By now
      # Lightsail has flipped traffic, so this should be near-instant -- but
      # poll for ~30s in case CF's edge briefly serves a stale cached response.
      # Cache-buster query param sidesteps any HTTP cache.
      - name: Smoke test healthz
        run: |
          for i in $(seq 1 12); do
            sleep 5
            COMMIT=$(curl -sf "https://api-allin.jianrontan.com/api/healthz?_t=$(date +%s)" \
              | jq -r '.commit // "unknown"')
            echo "[$i/12] healthz.commit=$COMMIT (expected ${{ steps.meta.outputs.sha }})"
            if [ "$COMMIT" = "${{ steps.meta.outputs.sha }}" ]; then
              echo "Deploy verified"
              exit 0
            fi
          done
          echo "::error::Healthz never returned the new SHA"
          exit 1
