# Frontend CI/CD: on push to main with changes under frontend/, build the Vite
# bundle and deploy to Cloudflare Pages via wrangler. The existing Pages project
# (`allin`, with the custom domain `allin.jianrontan.com` already wired up) was
# created via `wrangler pages deploy` -- so it lives as a Direct Upload project
# in CF's UI and can't be retroactively converted to Git-connected through the
# dashboard. This workflow does the equivalent: deploys on push.
#
# Secrets used (both stored in repo Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN -- scoped: Pages:Edit on this account
#   CLOUDFLARE_ACCOUNT_ID -- the account ID the Pages project lives under

name: Frontend deploy

on:
  push:
    branches: [main]
    paths:
      - frontend/**
      - .github/workflows/frontend-deploy.yml
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci          # reproducible install from package-lock.json (no lockfile drift)

      # VITE_* values for the production build are in frontend/.env.production
      # (committed to git -- they're public, ship in every visitor's JS bundle).
      # Vite auto-loads .env.production when `npm run build` runs in production
      # mode, which is the default. No inline env block needed here.
      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/dist --project-name=allin --branch=main
